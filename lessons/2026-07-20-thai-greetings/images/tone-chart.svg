<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Noto Sans Thai', 'Noto Sans', sans-serif">
  <rect width="800" height="600" fill="#f4f7fb"/>

  <!-- Title -->
  <text x="400" y="44" font-size="32" font-weight="700" fill="#1e293b" text-anchor="middle">วรรณยุกต์ไทย 5 เสียง (Thai 5 Tones)</text>
  <text x="400" y="76" font-size="20" fill="#475569" text-anchor="middle">แกนตั้ง = ระดับเสียง · แกนนอน = เวลา</text>

  <!-- Plot area -->
  <rect x="80" y="100" width="460" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Gridlines at 5 pitch levels -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="100" x2="540" y2="100"/>
    <line x1="80" y1="185" x2="540" y2="185"/>
    <line x1="80" y1="270" x2="540" y2="270"/>
    <line x1="80" y1="355" x2="540" y2="355"/>
    <line x1="80" y1="440" x2="540" y2="440"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="100" x2="80" y2="440" stroke="#334155" stroke-width="2"/>
  <line x1="80" y1="440" x2="560" y2="440" stroke="#334155" stroke-width="2"/>
  <polygon points="560,440 550,435 550,445" fill="#334155"/>

  <!-- Y level numbers -->
  <g fill="#334155" font-size="20" text-anchor="end">
    <text x="72" y="107">5</text>
    <text x="72" y="192">4</text>
    <text x="72" y="277">3</text>
    <text x="72" y="362">2</text>
    <text x="72" y="447">1</text>
  </g>
  <text x="92" y="122" font-size="18" fill="#94a3b8">สูง</text>
  <text x="92" y="432" font-size="18" fill="#94a3b8">ต่ำ</text>
  <text x="310" y="472" font-size="20" fill="#475569" text-anchor="middle">เวลา (time)</text>

  <!-- Tone contours -->
  <!-- mid 33 (level, blue) -->
  <path d="M80,270 L540,270" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <!-- low 21 (green) -->
  <path d="M80,355 L540,440" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <!-- falling 41 (red) -->
  <path d="M80,185 C200,150 300,180 540,440" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <!-- high 45 (orange) -->
  <path d="M80,205 C260,200 400,150 540,100" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
  <!-- rising 14 (purple) -->
  <path d="M80,430 C190,458 330,435 540,185" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

  <!-- start dots -->
  <circle cx="80" cy="270" r="5" fill="#2563eb"/>
  <circle cx="80" cy="355" r="5" fill="#059669"/>
  <circle cx="80" cy="185" r="5" fill="#dc2626"/>
  <circle cx="80" cy="205" r="5" fill="#ea580c"/>
  <circle cx="80" cy="430" r="5" fill="#7c3aed"/>

  <!-- Legend panel -->
  <rect x="560" y="100" width="232" height="340" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Row 1: mid -->
  <line x1="575" y1="128" x2="610" y2="128" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <text x="620" y="136" font-size="28" fill="#1e293b">สามัญ ดี</text>
  <text x="620" y="160" font-size="17" fill="#64748b">mid (33)</text>

  <!-- Row 2: low -->
  <line x1="575" y1="191" x2="610" y2="191" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
  <text x="620" y="199" font-size="28" fill="#1e293b">เอก สะ</text>
  <text x="620" y="223" font-size="17" fill="#64748b">low (21)</text>

  <!-- Row 3: falling -->
  <line x1="575" y1="254" x2="610" y2="254" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <text x="620" y="262" font-size="28" fill="#1e293b">โท ค่ะ</text>
  <text x="620" y="286" font-size="17" fill="#64748b">falling (41)</text>

  <!-- Row 4: high -->
  <line x1="575" y1="317" x2="610" y2="317" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
  <text x="620" y="325" font-size="28" fill="#1e293b">ตรี คะ</text>
  <text x="620" y="349" font-size="17" fill="#64748b">high (45)</text>

  <!-- Row 5: rising -->
  <line x1="575" y1="380" x2="610" y2="380" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
  <text x="620" y="388" font-size="28" fill="#1e293b">จัตวา ผม</text>
  <text x="620" y="412" font-size="17" fill="#64748b">rising (14)</text>

  <!-- Footer note -->
  <text x="400" y="512" font-size="22" fill="#334155" text-anchor="middle">สวัสดี = ต่ำ–ต่ำ–กลาง  ·  ค่ะ = โท  ·  คะ = ตรี</text>
  <text x="400" y="548" font-size="18" fill="#64748b" text-anchor="middle">ค่ะ (falling) ใช้ประโยคบอกเล่า  |  คะ (high) ใช้คำถาม</text>
</svg>
